# 東分局新聞稿排程爬取（取代 Zeabur 上的 n8n newthb + Browserless）
# 每 30 分鐘用 runner 內建的 Chrome 爬一次，內容有變才提交 data/news.json。
# 東分局資訊整合平台直接讀 raw.githubusercontent.com 上的這個檔，不經過 Netlify（Netlify 每次部署都扣點數）。
# 想立刻跑一次：Actions → 東分局新聞稿 → Run workflow
name: 東分局新聞稿

on:
  schedule:
    # 台灣 06:00～23:30 每 30 分鐘（cron 用 UTC，台灣 = UTC+8）
    - cron: '*/30 22-23,0-15 * * *'
  workflow_dispatch:
  # 改了爬蟲本身就馬上跑一次驗證
  push:
    branches: [main]
    paths: ['crawler/**', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: news-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 puppeteer-core（不下載瀏覽器，用 runner 內建 Chrome）
        working-directory: crawler
        run: npm install --no-audit --no-fund

      - name: 爬取新聞稿
        env:
          CHROME_PATH: /usr/bin/google-chrome
          TZ: Asia/Taipei
        run: node crawler/crawl-news.mjs

      - name: 有變動才提交
        run: |
          git add data/news.json
          if git diff --cached --quiet; then
            echo "沒有變動"
            exit 0
          fi
          git config user.name "news-crawler"
          git config user.email "news-crawler@users.noreply.github.com"
          git commit -m "更新新聞稿 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          git pull --rebase origin main
          git push
